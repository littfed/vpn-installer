services:
  sing-box:
    image: ghcr.io/sagernet/sing-box:latest
    container_name: sing-box-vpn
    restart: always
    network_mode: "host"
    cap_add:
      - NET_ADMIN
      - NET_RAW
    volumes:
      - ./config.json:/etc/sing-box/config.json:ro
      - ./certs:/etc/sing-box/certs:ro
    command: ["run", "-c", "/etc/sing-box/config.json"]
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  mtg:
    image: nineseconds/mtg:2
    container_name: mtproto-proxy
    restart: always
    network_mode: "host"
    environment:
      - MTG_SECRET=${MTG_SECRET:-}
      - MTG_BIND_TO=${MTG_BIND_TO:-0.0.0.0:8443}
    command: simple-run -c 8192 -a 1MB ${MTG_BIND_TO:-0.0.0.0:8443} ${MTG_SECRET:-ee000102030405060708090a0b0c0d0e0f7777772e636c6f7564666c6172652e636f6d}
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  caddy:
    image: caddy:alpine
    container_name: caddy-decoy
    restart: always
    ports:
      - "80:80"
      - "127.0.0.1:8443:8443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile
      - ./caddy/html:/usr/share/caddy:ro
      - ./caddy/data:/data
      - ./caddy/config:/config
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  sub-server:
    image: python:3.11-alpine
    container_name: vpn-sub-server
    restart: always
    network_mode: "service:caddy"
    volumes:
      - .:/opt/vpn-installer:ro
    command: ["python3", "/opt/vpn-installer/scripts/sub-server.py", "--host", "127.0.0.1", "--port", "8088", "--vpn-dir", "/opt/vpn-installer"]
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
