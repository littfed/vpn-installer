services:
  sing-box:
    image: ghcr.io/sagernet/sing-box:latest
    container_name: sing-box-vpn
    restart: always
    network_mode: "host"
    cap_add:
      - NET_ADMIN
      - NET_RAW
    volumes:
      - ./config.json:/etc/sing-box/config.json:ro
      - ./certs:/etc/sing-box/certs:ro
    command: ["run", "-c", "/etc/sing-box/config.json"]
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  caddy:
    image: caddy:alpine
    container_name: caddy-decoy
    restart: always
    ports:
      - "80:80"
      - "127.0.0.1:8443:8443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile
      - ./caddy/html:/usr/share/caddy:ro
      - ./caddy/data:/data
      - ./caddy/config:/config
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
